name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ main ]

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Create data dir & fetch AW dump
        run: |
          mkdir -p data
          curl -L -o data/AWBackup.sql "https://raw.githubusercontent.com/glaucojrcarvalho/pipeline-hadoop-spark/refs/heads/main/AWBackup.sql"

      - name: Copy env
        run: cp .env.example .env

      - name: Warm Docker image cache
        run: |
          docker pull mysql:8.0
          docker pull bde2020/hive:2.3.2-postgresql-metastore
          docker pull postgres:14
          docker pull apache/spark:latest

      - name: Launch stack
        run: docker compose up -d
      
      - name: Wait for services
        run: |
          echo "Waiting for MySQL..."
          for i in {1..60}; do
            if docker exec mysql mysqladmin ping -h 127.0.0.1 -uawuser -pawpass --silent; then
              echo "MySQL is up"; break
            fi
            sleep 5
          done
          echo "Sleep for Hive to settle..."; sleep 45

      - name: Ingest limited tables (Spark JDBC)
        env:
          SMOKE_TABLE_LIMIT: "1"
        run: make ingest

      - name: Smoke check (Spark/Hive)
        run: |
          docker exec spark-master /opt/spark/bin/spark-submit --master local[*] /workspace/scripts/smoke_check.py | tee smoke.log

      - name: Upload smoke log (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log

      - name: Comment smoke summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const header = '### CI Smoke Test\\n';
            const body = fs.readFileSync('smoke.log', 'utf8');
            const comment = header + '```\\n' + body.slice(-4000) + '\\n```';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body && c.body.startsWith(header));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
